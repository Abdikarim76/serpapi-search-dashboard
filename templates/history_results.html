<!DOCTYPE html>
<html>
<head>
    <title>Saved Search Results</title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='style.css') }}"
    >
</head>

<body>

    <div class="navigation">
        <a href="/">Search</a>
        |
        <a href="/history">Search History</a>
    </div>

    <h1>Saved Search Results</h1>

    {% if results %}

        {% for result in results %}

            <div class="result-card">

                <h3>
                    {{ loop.index }}. {{ result[1] }}
                </h3>

                <p>
                    <a href="{{ result[2] }}" target="_blank">
                        {{ result[2] }}
                    </a>
                </p>

                <p>
                    {{ result[3] }}
                </p>

            </div>

        {% endfor %}

    {% else %}

        <div class="result-card">
            <p>No saved results were found for this search.</p>
        </div>

    {% endif %}

</body>
</html>
