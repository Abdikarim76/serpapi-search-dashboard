<!DOCTYPE html>
<html>
<head>
    <title>SerpApi Search Dashboard</title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='style.css') }}"
    >
</head>

<body>

    <div class="navigation">
        <a href="/">Search</a>
        |
        <a href="/history">Search History</a>
    </div>

    <h1>SerpApi Search Dashboard</h1>

    <form method="POST">

        <input
            type="text"
            name="search_term"
            placeholder="Enter search keyword"
            value="{{ search_term }}"
        >

        <button type="submit">
            Search
        </button>

    </form>

    {% if error %}

        <div class="error">
            {{ error }}
        </div>

    {% endif %}

    {% if results %}

        <h2>Search Results</h2>

        {% for result in results %}

            <div class="result-card">

                <h3>
                    {{ loop.index }}. {{ result.title }}
                </h3>

                <p>
                    <a href="{{ result.link }}" target="_blank">
                        {{ result.link }}
                    </a>
                </p>

                <p>
                    {{ result.snippet }}
                </p>

            </div>

        {% endfor %}

    {% endif %}

</body>
</html>
