<!DOCTYPE html>
<html>
<head>
    <title>SerpApi Search Dashboard</title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='style.css') }}"
    >
</head>

<body>

    <div class="navigation">
        <a href="/">Search</a>
        |
        <a href="/history">Search History</a>
    </div>

    <h1>SerpApi Search Dashboard</h1>

    <form id="search-form">

        <input
            id="search-input"
            type="text"
            name="search_term"
            placeholder="Enter search keyword"
        >

        <button type="submit">
            Search
        </button>

    </form>

    <div
        id="error-container"
        class="error"
    ></div>

    <div id="results-container"></div>

    <script
        src="{{ url_for('static', filename='script.js') }}"
    ></script>

</body>
</html>
